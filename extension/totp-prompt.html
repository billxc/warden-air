<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Warden Air · Scan TOTP QR</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --card: #f3f4f6;
        --card-hover: #e5e7eb;
        --border: #e5e7eb;
        --accent: #175ddc;
        --accent-hover: #144ec0;
        --accent-fg: #ffffff;
        --danger: #dc2626;
        --ok: #15803d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181a1f;
          --fg: #f3f4f6;
          --muted: #9ca3af;
          --card: #23272f;
          --card-hover: #2d323d;
          --border: #303642;
          --accent: #3b82f6;
          --accent-hover: #2563eb;
          --accent-fg: #ffffff;
          --danger: #f87171;
          --ok: #34d399;
        }
      }
      * {
        box-sizing: border-box;
      }
      [hidden] {
        display: none !important;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
        gap: 8px;
      }
      .brand {
        font-weight: 600;
        font-size: 13.5px;
        white-space: nowrap;
      }
      .meta-tag {
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      main {
        flex: 1;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
      }
      .code-box {
        background: var(--card);
        border-radius: 8px;
        padding: 10px 12px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .code-val {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 22px;
        font-weight: 600;
        letter-spacing: 0.08em;
      }
      .ttl-pill {
        font-size: 11px;
        font-weight: 600;
        padding: 3px 7px;
        border-radius: 6px;
        background: rgba(59, 130, 246, 0.16);
        color: var(--accent);
      }
      .desc {
        font-size: 11.5px;
        color: var(--muted);
        line-height: 1.45;
      }
      .action-stack,
      .copy-stack {
        display: flex;
        gap: 8px;
      }
      .primary-btn,
      .secondary-btn {
        flex: 1;
        font: inherit;
        font-weight: 600;
        font-size: 12.5px;
        padding: 8px 10px;
        border-radius: 8px;
        cursor: pointer;
      }
      .primary-btn {
        border: none;
        background: var(--accent);
        color: var(--accent-fg);
      }
      .primary-btn:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      .secondary-btn {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
        font-weight: 500;
      }
      .secondary-btn:hover:not(:disabled) {
        background: var(--card-hover);
      }
      .copy-btn {
        flex: 1;
        font: inherit;
        font-size: 11.5px;
        font-weight: 500;
        padding: 6px 8px;
        border-radius: 7px;
        border: 1px solid var(--border);
        background: transparent;
        color: var(--fg);
        cursor: pointer;
        white-space: nowrap;
      }
      .copy-btn:hover:not(:disabled) {
        background: var(--card);
      }
      .copy-btn.copied {
        color: var(--ok);
        border-color: var(--ok);
      }
      .primary-btn:disabled,
      .secondary-btn:disabled,
      .copy-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .hint {
        font-size: 11.5px;
        color: var(--danger);
      }
      .hint.ok {
        color: var(--ok);
        font-weight: 600;
      }
      footer {
        padding: 9px 14px 11px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .link-btn {
        font: inherit;
        font-size: 12px;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 5px 10px;
        cursor: pointer;
      }
      .link-btn:hover:not(:disabled) {
        color: var(--fg);
        background: var(--card);
      }
    </style>
  </head>
  <body>
    <header>
      <div id="brandTitle" class="brand">🔐 Scan TOTP QR</div>
      <div id="metaTag" class="meta-tag">Scanning…</div>
    </header>
    <main>
      <div id="codeBox" class="code-box" hidden>
        <div id="codeVal" class="code-val"></div>
        <div id="ttlPill" class="ttl-pill"></div>
      </div>
      <div id="descBox" class="desc">Scanning visible page for a TOTP QR code…</div>
      <div id="actionSlot" class="action-stack"></div>
      <div id="copySlot" class="copy-stack" hidden>
        <button id="copyTotpUrlBtn" type="button" class="copy-btn">TOTP URL Copied</button>
        <button id="copyPageUrlBtn" type="button" class="copy-btn">Copy Page URL</button>
      </div>
      <div id="hintBox" class="hint" hidden></div>
    </main>
    <footer>
      <button id="rescanBtn" type="button" class="link-btn">Scan Again</button>
      <button id="closeBtn" type="button" class="link-btn" style="margin-left: auto">Close</button>
    </footer>
    <script type="module" src="totp-prompt.js"></script>
  </body>
</html>
