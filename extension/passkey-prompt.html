<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Warden Air · Passkey</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --card: #f3f4f6;
        --card-hover: #e5e7eb;
        --border: #e5e7eb;
        --accent: #175ddc;
        --accent-hover: #144ec0;
        --accent-fg: #ffffff;
        --danger: #dc2626;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181a1f;
          --fg: #f3f4f6;
          --muted: #9ca3af;
          --card: #23272f;
          --card-hover: #2d323d;
          --border: #303642;
          --accent: #3b82f6;
          --accent-hover: #2563eb;
          --accent-fg: #ffffff;
          --danger: #f87171;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
      }
      .brand {
        font-weight: 600;
        font-size: 13.5px;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .account-tag {
        font-size: 11px;
        color: var(--muted);
        max-width: 155px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      main {
        flex: 1;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
      }
      .rp-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .rp-label {
        font-size: 12px;
        color: var(--muted);
      }
      .rp-pill {
        font-size: 12px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 6px;
        background: var(--card);
        color: var(--fg);
        max-width: 210px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .list {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      button.item {
        width: 100%;
        text-align: left;
        font: inherit;
        color: inherit;
        background: var(--card);
        border: 1px solid transparent;
        border-radius: 8px;
        padding: 8px 10px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      button.item:hover:not(:disabled) {
        background: var(--card-hover);
      }
      button.item:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 1px;
      }
      button.item:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .item-meta {
        min-width: 0;
        flex: 1;
      }
      .item-title {
        font-weight: 500;
        font-size: 13px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .item-sub {
        font-size: 11px;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .primary-btn {
        width: 100%;
        font: inherit;
        font-weight: 600;
        font-size: 13px;
        padding: 9px 12px;
        border-radius: 8px;
        border: none;
        background: var(--accent);
        color: var(--accent-fg);
        cursor: pointer;
      }
      .primary-btn:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      .primary-btn:disabled {
        opacity: 0.65;
        cursor: default;
      }
      .error {
        font-size: 11.5px;
        color: var(--danger);
      }
      footer {
        padding: 9px 14px 11px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .link-btn {
        font: inherit;
        font-size: 12px;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 5px 10px;
        cursor: pointer;
      }
      .link-btn:hover:not(:disabled) {
        color: var(--fg);
        background: var(--card);
      }
      .link-btn:disabled {
        opacity: 0.55;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <div class="brand">🔐 Passkey Sign-in</div>
      <div id="accountTag" class="account-tag"></div>
    </header>
    <main>
      <div class="rp-row">
        <span class="rp-label">Relying party</span>
        <span id="rpPill" class="rp-pill"></span>
      </div>
      <div id="bodySlot"></div>
      <div id="errorBox" class="error" hidden></div>
    </main>
    <footer>
      <button id="fallbackBtn" type="button" class="link-btn" hidden>Use device key</button>
      <button id="cancelBtn" type="button" class="link-btn" style="margin-left: auto">Cancel</button>
    </footer>
    <script type="module" src="passkey-prompt.js"></script>
  </body>
</html>
