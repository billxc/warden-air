<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Warden Air · Save Login</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #ffffff;
        --fg: #111827;
        --muted: #6b7280;
        --card: #f3f4f6;
        --card-hover: #e5e7eb;
        --border: #e5e7eb;
        --accent: #175ddc;
        --accent-hover: #144ec0;
        --accent-fg: #ffffff;
        --danger: #dc2626;
        --info: #1d4ed8;
        --ok: #15803d;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #181a1f;
          --fg: #f3f4f6;
          --muted: #9ca3af;
          --card: #23272f;
          --card-hover: #2d323d;
          --border: #303642;
          --accent: #3b82f6;
          --accent-hover: #2563eb;
          --accent-fg: #ffffff;
          --danger: #f87171;
          --info: #93c5fd;
          --ok: #34d399;
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        font: 13px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--fg);
        user-select: none;
      }
      body {
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 10px 14px;
        border-bottom: 1px solid var(--border);
      }
      .brand {
        font-weight: 600;
        font-size: 13.5px;
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .account-tag {
        font-size: 11px;
        color: var(--muted);
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      main {
        flex: 1;
        padding: 12px 14px;
        display: flex;
        flex-direction: column;
        gap: 10px;
        overflow-y: auto;
      }
      .site-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .site-label {
        font-size: 12px;
        color: var(--muted);
      }
      .site-pill {
        font-size: 12px;
        font-weight: 600;
        padding: 2px 8px;
        border-radius: 6px;
        background: var(--card);
        color: var(--fg);
        max-width: 225px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .text-input {
        width: 100%;
        font: inherit;
        font-size: 12.5px;
        color: var(--fg);
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 7px 10px;
        outline: none;
      }
      .text-input:focus {
        border-color: var(--accent);
      }
      .text-input:disabled {
        opacity: 0.65;
      }
      .update-box {
        background: var(--card);
        border-radius: 8px;
        padding: 8px 10px;
        font-size: 12.5px;
      }
      .update-title {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .update-sub {
        font-size: 11px;
        color: var(--muted);
        margin-top: 2px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .action-stack {
        display: flex;
        gap: 8px;
      }
      .primary-btn,
      .secondary-btn {
        flex: 1;
        font: inherit;
        font-weight: 600;
        font-size: 13px;
        padding: 8px 12px;
        border-radius: 8px;
        cursor: pointer;
      }
      .primary-btn {
        border: none;
        background: var(--accent);
        color: var(--accent-fg);
      }
      .primary-btn:hover:not(:disabled) {
        background: var(--accent-hover);
      }
      .secondary-btn {
        border: 1px solid var(--border);
        background: var(--card);
        color: var(--fg);
        font-weight: 500;
      }
      .secondary-btn:hover:not(:disabled) {
        background: var(--card-hover);
      }
      .primary-btn:disabled,
      .secondary-btn:disabled {
        opacity: 0.6;
        cursor: default;
      }
      .hint {
        font-size: 11.5px;
        color: var(--danger);
      }
      .hint.info {
        color: var(--info);
      }
      .hint.ok {
        color: var(--ok);
        font-weight: 600;
      }
      footer {
        padding: 9px 14px 11px;
        border-top: 1px solid var(--border);
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
      }
      .link-btn {
        font: inherit;
        font-size: 12px;
        background: transparent;
        color: var(--muted);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 5px 10px;
        cursor: pointer;
      }
      .link-btn:hover:not(:disabled) {
        color: var(--fg);
        background: var(--card);
      }
      .link-btn:disabled {
        opacity: 0.55;
        cursor: default;
      }
    </style>
  </head>
  <body>
    <header>
      <div id="brandTitle" class="brand">🔑 Save Login</div>
      <div id="accountTag" class="account-tag"></div>
    </header>
    <main>
      <div class="site-row">
        <span class="site-label">Website</span>
        <span id="hostPill" class="site-pill"></span>
      </div>
      <input
        id="usernameInput"
        class="text-input"
        type="text"
        placeholder="Username (optional)"
        spellcheck="false"
        autocomplete="off"
      />
      <div id="updateBox" class="update-box" hidden>
        <div id="updateTitle" class="update-title"></div>
        <div id="updateSub" class="update-sub"></div>
      </div>
      <div id="actionSlot" class="action-stack"></div>
      <div id="hintBox" class="hint" hidden></div>
    </main>
    <footer>
      <button id="neverBtn" type="button" class="link-btn">Never for site</button>
      <button id="notNowBtn" type="button" class="link-btn" style="margin-left: auto">
        Not now
      </button>
    </footer>
    <script type="module" src="save-prompt.js"></script>
  </body>
</html>
